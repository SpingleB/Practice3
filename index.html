<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Social links profile</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit&display=swap');
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="conainer">
    <section class="resume">
      <div class="img-div">
        <img src="assets/images/avatar-jessica.jpeg" alt="Jessica">
      </div>
    <div class="main-info">
      <h2 id="h2-jes">Jessica Randall</h2>
      <p id="p-adress">London, United Kingdom</p>
      <p id="who-i-am">"Front-end developer and avid reader."</p>
      </div>
    <div class="div-for-social-media">
     <div class="social-media"><p class="social-media-text">GitHub</p></div>
      <div class="social-media"><p class="social-media-text">Frontend Mentor</p></div>
      <div class="social-media"><p class="social-media-text">LinkedIn</p></div>
      <div class="social-media"><p class="social-media-text">Twitter</p></div>
      <div class="social-media"><p class="social-media-text">Instagram</p></div>
    </div>
  </section>
  </div>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
